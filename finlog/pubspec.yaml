name: finlog
description: "소비(가계부)와 투자 포트폴리오를 하나의 앱에서 통합 관리"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태관리
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 로컬 DB
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.29

  # 라우팅
  go_router: ^15.1.2

  # 차트
  fl_chart: ^0.70.2

  # HTTP 클라이언트
  dio: ^5.8.0

  # Google 인증 / Drive
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # 보안
  flutter_secure_storage: ^9.2.4

  # CSV
  csv: ^6.0.0

  # 오프라인 감지
  connectivity_plus: ^6.1.4

  # 유틸리티
  intl: ^0.20.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # 코드 생성
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  drift_dev: ^2.26.0
  riverpod_lint: ^2.6.5
  custom_lint: ^0.7.5

flutter:
  uses-material-design: true
